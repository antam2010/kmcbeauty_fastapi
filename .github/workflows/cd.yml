# ==============================================================================
# CD 파이프라인 (SPEC-INFRA-001, REQ-INFRA-008 / 009 / 010)
#
# 목적: main 병합 시 이미지를 불변 SHA 태그로 GHCR 에 게시하고,
#       매니저 노드에 SSH 로 접속해 마이그레이션 후 스택을 무중단 배포한다.
#
# 흐름:
#   build-and-push: GHCR 로그인 → docker build → push ghcr.io/<owner>/kmcbeauty-api:<sha>
#   deploy:         environment=production(수동 승인 가능) → SSH → 시크릿 사전 검증
#                   (REQ-INFRA-113, docker secret ls) → deploy_migrate → stack deploy
#
# 시크릿 사전 검증(SPEC-INFRA-002 REQ-INFRA-113):
#   SSH 스크립트 선두에서 필수 Docker secret(kmc_secret_key_v1/kmc_fernet_key_v1/
#   kmc_database_url_v1/firebase_service_account) 존재를 확인하고, 누락 시 배포를 중단한다.
#
# 필요한 저장소 시크릿(docs/deployment.md 참조):
#   SWARM_SSH_HOST  : 매니저 노드 호스트/IP
#   SWARM_SSH_USER  : 배포 계정
#   SWARM_SSH_KEY   : 배포 계정 개인키(최소 권한)
#   (GHCR 푸시는 기본 제공되는 GITHUB_TOKEN + packages:write 권한 사용)
# ==============================================================================
name: CD

on:
  push:
    branches: [main]

env:
  # GHCR 이미지 경로(소문자 owner 규약).
  IMAGE: ghcr.io/antam2010/kmcbeauty-api

jobs:
  build-and-push:
    name: Build & Push image (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 불변 SHA 태그로만 푸시한다(REQ-INFRA-003). latest 태그는 생성하지 않는다.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Swarm manager
    needs: build-and-push
    runs-on: ubuntu-latest
    # protected environment 로 수동 승인 게이트를 걸 수 있다(REQ-INFRA-010).
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SWARM_SSH_HOST }}
          username: ${{ secrets.SWARM_SSH_USER }}
          key: ${{ secrets.SWARM_SSH_KEY }}
          # 매니저 노드에 저장소 체크아웃이 존재한다고 가정(docker-stack.yml/scripts 사용).
          # IMAGE_TAG 를 불변 SHA 로 주입하고, 스택 업데이트 전 마이그레이션을 실행한다(REQ-INFRA-005).
          envs: GITHUB_SHA
          script: |
            set -euo pipefail
            cd "${DEPLOY_DIR:-/opt/kmcbeauty}"
            export IMAGE_TAG="ghcr.io/antam2010/kmcbeauty-api:${GITHUB_SHA}"
            echo "Deploying ${IMAGE_TAG}"
            # --- 시크릿 사전 검증(REQ-INFRA-113): 마이그레이션/배포 이전에 수행 ---
            # 필수 Docker secret 이 하나라도 없으면 fail-fast(빈/오설정 대상으로 진행 방지).
            # 회전 중이면 REQUIRED_SECRETS 를 _v2 로 갱신한다(source 만 교체, target 불변).
            REQUIRED_SECRETS="kmc_secret_key_v1 kmc_fernet_key_v1 kmc_database_url_v1 firebase_service_account"
            EXISTING_SECRETS="$(docker secret ls --format '{{.Name}}')"
            MISSING=""
            for s in $REQUIRED_SECRETS; do
              echo "$EXISTING_SECRETS" | grep -qx "$s" || MISSING="$MISSING $s"
            done
            if [ -n "$MISSING" ]; then
              echo "ERROR: 필수 Docker secret 누락:${MISSING}. 배포를 중단합니다." >&2
              echo "먼저 매니저 노드에서 docker secret create 로 등록하세요(docs/deployment.md)." >&2
              exit 1
            fi
            # .env.prod(비시크릿 설정) 존재도 함께 확인.
            if [ ! -f .env.prod ]; then
              echo "ERROR: .env.prod 가 매니저 노드에 없습니다. 배포를 중단합니다." >&2
              exit 1
            fi
            echo "OK: 필수 시크릿 및 .env.prod 확인 완료."
            # 최신 배포 매니페스트/스크립트 동기화(운영 노드의 배포 브랜치 기준).
            git fetch --all --prune
            git checkout main
            git reset --hard origin/main
            # GHCR pull 권한이 사전 구성되어 있어야 한다(docker login ghcr.io).
            docker pull "${IMAGE_TAG}"
            # 배포 전 마이그레이션(expand/contract, 하위 호환) 실행.
            ./scripts/deploy_migrate.sh
            # 불변 태그 주입 후 무중단 롤링 배포.
            docker stack deploy -c docker-stack.yml kmcbeauty
        env:
          GITHUB_SHA: ${{ github.sha }}
