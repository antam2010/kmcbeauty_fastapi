# ==============================================================================
# CI 파이프라인 (SPEC-INFRA-001, REQ-INFRA-006 / REQ-INFRA-007)
#
# 목적: PR 및 push 에서 코드 품질 게이트를 자동 강제한다.
#   checkout → Python 3.13(+pip 캐시) → 의존성 설치
#     → ruff check → ruff format --check → pytest(커버리지 리포트)
#
# Redis 서비스 컨테이너를 두지 않는 이유:
#   현재 테스트 스위트는 DB/Redis/외부 연동을 모두 모킹하므로(tests/conftest.py 는
#   환경변수만 주입) 실제 Redis 브로커가 필요 없다. 통합 테스트가 추가되면
#   `services: redis:` 블록을 여기에 추가한다.
#
# 커버리지: 리포트만 출력하며 --cov-fail-under 게이트는 두지 않는다(REQ-INFRA-006 결정).
# ==============================================================================
name: CI

on:
  pull_request:
  push:
    branches: [main]  # PR 이 주 게이트 — push 이중 실행 방지

# GITHUB_TOKEN 최소 권한 (읽기 전용)
permissions:
  contents: read

# 동일 브랜치의 이전 실행은 취소해 러너 낭비를 줄인다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & Test (Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 린트: py313 규칙(pyproject.toml target-version=py313)으로 정합.
      - name: Ruff lint (check)
        run: ruff check .

      - name: Ruff format (check)
        run: ruff format --check .

      # 테스트: 커버리지 리포트 출력(게이트 없음).
      - name: Pytest with coverage report
        run: pytest --cov=app --cov=worker --cov-report=term-missing --cov-report=xml
